<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="joke-style.css">
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random joke to brighten your day!</p>

        <div id="jokeBox" class="joke-box">
            <div id="jokeContent" class="joke-content">
                <p id="jokeText">Click the button to get a joke!</p>
            </div>
        </div>

        <div class="button-group">
            <button id="newJokeBtn" class="btn btn-primary">🎲 Get New Joke</button>
            <button id="copyBtn" class="btn btn-secondary">📋 Copy Joke</button>
        </div>

        <div id="notification" class="notification"></div>
    </div>

    <script src="joke-script.js"></script>
</body>
</html>
