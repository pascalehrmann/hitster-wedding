<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster Wedding Bingo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>

            <h1>
                <span class="blue">H</span>
                <span class="green">I</span>
                <span class="yellow">T</span>
                <span class="pink">S</span>
                <span class="red">T</span>
                <span class="blue">E</span>
                <span class="green">R</span>
            </h1>

            <h2>WEDDING BINGO</h2>

            <p class="subtitle">
                Gintare & Daniel Edition
            </p>

        </header>

        <div class="song-counter">
            🎵 Gespielte Songs:
            <span id="songCounter">0</span>
        </div>

        <div id="discoball">
            🪩
        </div>

        <div class="buttons">

            <button id="drawButton">
                🎲 Kategorie auslosen
            </button>

            <button id="resetButton">
                🔄 Neues Spiel
            </button>

        </div>

        <div id="result" class="hidden">

            <div id="categoryIcon"></div>

            <h3 id="categoryTitle"></h3>

            <div id="categoryDescription"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
