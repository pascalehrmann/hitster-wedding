<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hitster Wedding Bingo</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background-glow"></div>

<header>

    <h1>
        <span class="blue">H</span>
        <span class="green">I</span>
        <span class="yellow">T</span>
        <span class="pink">S</span>
        <span class="red">T</span>
        <span class="blue">E</span>
        <span class="green">R</span>
    </h1>

    <h2>WEDDING BINGO</h2>

    <p class="edition">
        Gintare & Daniel Edition
    </p>

</header>


<div class="round">

    Runde <span id="roundNumber">1</span>

</div>


<main>

    <div id="discoball">

        🪩

    </div>

    <button id="drawButton">

        🎲 Kategorie auslosen

    </button>


    <section id="result" class="hidden">

        <div id="categoryIcon"></div>

        <h3 id="categoryTitle"></h3>

        <div id="categoryDescription"></div>

    </section>

</main>


<footer>

    Wer zuerst fünf Felder waagerecht, senkrecht oder diagonal markiert hat,
    ruft <strong>BINGO!</strong>

</footer>

<script src="script.js"></script>

</body>

</html>
